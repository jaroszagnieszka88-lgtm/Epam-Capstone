<header class="header">
    <div class="container header-wrapper">
        <div class="header-socials">
            <a href="#"><img src="/images/facebook.png" alt="facebook" /></a>
            <a href="#"><img src="/images/twitter.png" alt="twitter" /></a>
            <a href="#"><img src="/images/instagram.png" alt="instagram" /></a>
        </div>
        <div class="logo"><a href="/" class="bold-700">BEST SHOP</a></div>

        <div class="header-icons">
            <img src="/images/user.png" alt="Lousergo" id="user-trigger" />
            <a href="/cart" id="cart-icon">
                <img src="/images/shopping-cart.png" alt="Shopping Cart" />
                <div id="cart-counter" class="bold-700" hidden></div>
            </a>
        </div>
    </div>
    <hr class="header-divider" />
    <nav class="nav">
        <ul class="nav-list">
            <li><a href="/" class="nav-list-item">Home</a></li>
            <li><a href="/catalog" class="nav-list-item nav-list-item-expandable">Catalog</a></li>
            <li><a href="/about" class="nav-list-item">About Us</a></li>
            <li><a href="/contact" class="nav-list-item">Contact Us</a></li>
        </ul>
    </nav>
</header>

<!-- MODAL -->
<div class="modal-backdrop hidden" id="loginModal">
    <div class="modal">
        <form id="login-form">
            <div class="form-row">
                <label for="email">Email address <span>*</span></label>
                <input type="email" id="email" placeholder="" autocomplete="off" />
            </div>

            <div class="form-row">
                <label for="password">Password <span>*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="" autocomplete="off" required />
                    <img id="toggle-password" src="/images/showPassword.png">
                </div>
            </div>

            <div class="form-row-flex">
                <div class="form-row-flex">
                    <input type="checkbox" id="remember-me" />
                    <label for="remember-me">Remember Me</label>
                </div>
                <a href="#" class="forgot-password bold-700">Forgot Password?</a>

            </div>


            <button type="submit" class="btn btn-primary">LOG IN</button>
        </form>
    </div>
</div>
