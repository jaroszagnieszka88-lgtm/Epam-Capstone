<header class="header">
    <div class="container header__wrapper">
        <div class="header__socials">
            <a href="#"><img src="/images/facebook.png" alt="facebook" /></a>
            <a href="#"><img src="/images/twitter.png" alt="twitter" /></a>
            <a href="#"><img src="/images/instagram.png" alt="instagram" /></a>
        </div>
        <div class="logo"><a href="/" class="bold--700">BEST SHOP</a></div>

        <div class="header__icons">
            <a href="#"><img src="/images/user.png" alt="Lousergo" id="userTrigger" /></a>
            <a href="#"><img src="/images/shopping-cart.png" alt="Shopping Cart" /></a>
        </div>
    </div>
    <hr class="header__divider" />
    <nav class="nav">
        <ul class="nav__list">
            <li><a href="/" class="nav__list__item nav__list__item--active">Home</a></li>
            <li><a href="/catalog" class="nav__list__item nav__list__item--expandable">Catalog</a></li>
            <li><a href="/about" class="nav__list__item">About Us</a></li>
            <li><a href="/contact" class="nav__list__item">Contact Us</a></li>
        </ul>
    </nav>
</header>

<!-- MODAL -->
<div class="modal-backdrop hidden" id="loginModal">
    <div class="modal">
        <form id="loginForm">
            <div class="form-row">
                <label for="email">Email address <span>*</span></label>
                <input type="email" id="email" placeholder="" autocomplete="off"/>
            </div>

            <div class="form-row">
                <label for="password">Password <span>*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="" autocomplete="off"/>
                    <img id="togglePassword" src="/images/showPassword.png">
                </div>
            </div>

            <div class="form-row--flex">
                <div class="form-row--flex">
                    <input type="checkbox" id="rememberMe" />
                    <label for="rememberMe">Remember Me</label>
                </div>
                <a href="#" class="forgot-password bold--700">Forgot Password?</span>

            </div>


            <button type="submit" class="btn btn--primary">LOG IN</button>
        </form>
    </div>
</div>
